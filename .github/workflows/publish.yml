name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: false
      - name: Verify version tag
        run: test "$GITHUB_REF_NAME" = "v$(uv --no-config version --short)"
      - name: Test
        run: uv --no-config run --locked python -m unittest discover -s tests
      - name: Build
        run: uv --no-config build --no-sources
      - name: Publish
        run: uv publish --trusted-publishing always
